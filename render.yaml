# Free-tier deploy on Render: New > Blueprint, point at this repo, then set LLM_API_KEY and API_KEY.
services:
  - type: web
    name: receipt-agent
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: API_KEY
        sync: false
